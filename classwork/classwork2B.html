<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>second class work</title>
    <style>

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .bg-container {
            min-height: 100vh;
            width: 100%;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .bg-text {
            color: red;
            font-size: 24px;
            font-weight: 900;
        }

        .bg1 {
            background-image: url("bg1.jpg");
        }

        .bg2 {
            background-image: url("bg2.jpg");
        }

        .bg3 {
            background-image: url("bg3.jpg");
        }

        .bg4 {
            background-image: url("bg4.jpg");
        }

        .bg5 {
            background-image: url("bg5.jpg");
        }

        .bg6 {
            background-image: url("bg6.jpg");
        }

        .bg7 {
            background-image: url("bg7.jpg");
        }

        .bg8 {
            background-image: url("bg8.jpg");
        }
    </style>
</head>

<body>


    <div class="bg-container bg1">
        <p class="bg-text">This is first background amet.</p>
    </div>
    <div class="bg-container bg2">
        <p class="bg-text">This is second background amet.</p>
    </div>
    <div class="bg-container bg3">
        <p class="bg-text">This is third background amet.</p>
    </div>
    <div class="bg-container bg4">
        <p class="bg-text">This is fourth background amet.</p>
    </div>
    <div class="bg-container bg5">
        <p class="bg-text">This is fift background amet.</p>
    </div>
    <div class="bg-container bg6">
        <p class="bg-text">This is sixth background amet.</p>
    </div>
    <div class="bg-container bg7">
        <p class="bg-text">This is seventh background amet.</p>
    </div>
    <div class="bg-container bg8">
        <p class="bg-text">This is eight background amet.</p>
    </div>
</body>

</html>
