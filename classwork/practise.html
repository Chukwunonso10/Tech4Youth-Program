<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .bg-container {
            background-repeat: no-repeat;
            background-size: cover;
            height: 100vh;
            background-attachment: fixed;
        }

        .bg-1{
            background-image: url("bg1.jpg");
        }
        .bg-2{
            background-image: url("bg2.jpg");
        }
        .bg-3{
            background-image: url("bg3.jpg");
        }
        .bg-4{
            background-image: url("bg4.jpg");
        }
        .bg-5{
            background-image: url("bg5.jpg");
        }
        .bg-6{
            background-image: url("bg6.jpg");
        }
        .bg-7{
            background-image: url("bg7.jpg");
        }
        .bg-8{
            background-image: url("bg8.jpg");
        }

        p{
            color: red;
        }
    </style>
</head>

<body>
    <div class="bg-container bg-1">
        <p>This is background 1</p>
    </div>
    <div class="bg-container bg-2">
        <p>This is background 2</p>
    </div>
    <div class="bg-container bg-3">
        <p>This is background 3</p>
    </div>
    <div class="bg-container bg-4">
        <p>This is background 4</p>
    </div>
    <div class="bg-container bg-5">
        <p>This is background 5</p>
    </div>
    <div class="bg-container bg-6">
        <p>This is background 6</p>
    </div>
    <div class="bg-container bg-7">
        <p>This is background 7</p>
    </div>
    <div class="bg-container bg-8">
        <p>This is background 6</p>
    </div>
</body>

</html>
