<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>learning</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
 div > h1{
    color:yellow;
 }
        body {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 500;
            background-color: hsl(0, 4%, 90%);
            height: 100vh;
            color: #1d1c1c;
            position: relative;
            overflow: scroll;
        }

        .form-container {
            background-color: white;
            border-radius: 12px;
            position: absolute;
            width: 90%;
            max-width: 450px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 40px;
        }

        h1,
        h5 {
            text-align: center;
            font-weight: 500;
            text-transform: capitalize;
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 16px;
            color: #8e8989;
            text-transform: capitalize;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: none;
            border-bottom: 2px solid #585555;
            outline: none;
            font-size: 16px;
            color: #4a4949;
            margin-bottom: 12px;
        }

        .form-group input:focus {
            border-bottom-color: blue;
        }

        button {
            display: block;
            width: 100%;
            padding: 10px;
            border: none;
            background-color: blue;
            border-radius: 10px;
            margin-top: 12px;
            cursor: pointer;
            color: white;
            text-transform: capitalize;
            font-size: 500;
            transition: background-color 0.7s;
        }

        button:hover {
            background-color: rgb(185, 185, 242);
            color: blue
        }

        .checkbox-group {
            margin-top: 12px
        }

        .checkbox-group .checkbox {
            vertical-align: middle;

        }

        .checkbox-group label {
            vertical-align: middle;
            margin-left: 12px;

        }

        .access {
            display: block;
            overflow: hidden;
            margin-top: 16px;
            text-align: center;

        }

        .access::before,
        .access::after {
            content: "";
            display: inline-block;
            width: 100px;
            height: 2px;
            background-color: #cdc7c7;
            vertical-align: middle;
            text-align: center;
        }

        .access::before {
            margin-right: 12px;
        }

        .access::after {
            margin-left: 12px;
        }

        .blocked {
            width: 100%;
            margin: 12px auto;
            text-align: center;

        }

        .blocked .links {
            display: inline-block;
            padding: 12px 0;
            width: 30%;
            border: 2px solid rgb(126, 119, 119);
            margin-right: 6px;
            color: blue;
            text-decoration: none;

        }

        .form-question {
            text-align: center;
            font-weight: 300;
            font-size: 14px;
        }
        .form-question a {
            text-decoration: none;
        }
        </style>
</head>

<body>
    <div class="form-container">
        <h1>sign up</h1>
        <h5>sign up to continue</h5>
         *

        <form action="example.html" method="get">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" name="name" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">password</label>
                <input type="password" name=" password" id="password" required>
            </div>

            <button type="submit">sign up</button>

            <div class="checkbox-group">
                <input class="checkbox" type="checkbox" id="remember" name="remember" value="remember">
                <label for="remember">Remember me</label>
            </div>

            <span class="access">ACCESS QUICKLY</span>
            <div class="blocked">
                <a href="#" class="links">Google</a>
                <a href="#" class="links">Linkedln</a>
                <a href="#" class="links">SSO</a>

            </div>
        </form>

        <p class="form-question"> Aready have an account? <a href="contact.html" target="name">Sign in</a></p>

      
    </div>

<p>this will work</p>
</body>

</html>
