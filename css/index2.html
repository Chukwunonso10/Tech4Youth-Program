<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Tutorial</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        /* selector(s){
            property: value
        } */

        h1 {
            font-size: 50px;
            font-family: 'Times New Roman', Times, serif;
            color: yellow;
            border: 5px solid rgb(111, 25, 25);
            border: 5px solid green;
        }

        .pet{
            font-size: 20px;
            color: blueviolet;
            background-color: rgb(12, 8, 16);
        }   

        .cat{
            font-size: 70px;

        }

        #set{
            color: rgb(215, 240, 49);
            background-color: rgb(37, 4, 4)!important;
            
        }

        .bag{
            color: blue;
            background-color: brown;
            font-size: 30px;
        }
    </style>
</head>

<body>
    <!-- css units
    ch, px, rem, em, vh, dvh -->

    <h1 style="color: red" ; font-size="30px" ;>Index</h1>
    <h1>index</h1>

    <h1>element selector</h1>

    <h1 class="pet cat">Diffe</h1>
    <p class="pet">lorem</p>

    <p id="set" class="bag" style="color: orchid";>id selector</p>

    <!-- 
    id > class name
    inline > id
    !important is higher than both id and inline
    -->


</body>

</html>
